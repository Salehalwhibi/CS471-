{% extends "layouts/base.html" %}
{% block title %}Edit Book{% endblock %}
{% block content %}
<h1>Edit Book</h1>
<form method="post">
    {% csrf_token %}
    <label>Title: <input type="text" name="title" value="{{ book.title }}" required></label><br>
    <label>Author: <input type="text" name="author" value="{{ book.author }}" required></label><br>
    <label>Price: <input type="number" step="0.01" name="price" value="{{ book.price }}" required></label><br>
    <label>Edition: <input type="number" name="edition" value="{{ book.edition }}" required></label><br>
    <label>Quantity: <input type="number" name="quantity" value="{{ book.quantity }}" required></label><br>
    <button type="submit">Save Changes</button>
</form>
<a href="{% url 'books.lab9_part1.listbooks' %}">Back to List</a>
{% endblock %}
