{% extends "layouts/base.html" %}
{% block title %}Add Book{% endblock %}
{% block content %}
<h1>Add New Book</h1>
<form method="post">
    {% csrf_token %}
    <label>Title: <input type="text" name="title" required></label><br>
    <label>Author: <input type="text" name="author" required></label><br>
    <label>Price: <input type="number" step="0.01" name="price" required></label><br>
    <label>Edition: <input type="number" name="edition" required></label><br>
    <label>Quantity: <input type="number" name="quantity" required></label><br>
    <button type="submit">Add Book</button>
</form>
<a href="{% url 'books.lab9_part1.listbooks' %}">Back to List</a>
{% endblock %}
